<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мой первый тур</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0a0a0a; overflow:hidden; height:100vh; font-family:'Segoe UI',sans-serif; }
    #container { width:100vw; height:100vh; }
    #toolbar {
      position:absolute; top:20px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
      padding:8px 20px; border-radius:30px; z-index:10;
      display:flex; gap:8px; align-items:center;
      border:1px solid rgba(255,255,255,0.1);
    }
    #toolbar button {
      background:rgba(255,255,255,0.1); border:none; color:#fff;
      padding:6px 14px; border-radius:20px; cursor:pointer;
      font-size:13px; transition:background 0.2s;
    }
    #toolbar button:hover { background:rgba(255,255,255,0.2); }
    #toolbar .scene-name {
      color:#aaa; font-size:13px; margin:0 8px; min-width:100px; text-align:center;
    }
    #toolbar .counter {
      color:#666; font-size:12px; margin:0 4px;
    }
    .pnlm-container { width:100% !important; height:100% !important; }
    @media (max-width:600px) {
      #toolbar { top:10px; padding:6px 12px; flex-wrap:wrap; justify-content:center; max-width:95%; }
      #toolbar button { font-size:11px; padding:4px 10px; }
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="toolbar">
    <button id="prevBtn">◀</button>
    <span class="scene-name" id="sceneName">Загрузка...</span>
    <button id="nextBtn">▶</button>
    <span class="counter" id="counter">1/0</span>
  </div>

  <script>
    const scenes = [{"name":"Camera_360_01","file":"scene_0001.jpeg"},{"name":"Camera_360_02","file":"scene_0002.jpeg"},{"name":"Camera_360_03","file":"scene_0003.jpeg"}];
    let currentIndex = 0;
    let viewer = null;

    function initViewer(index) {
      const scene = scenes[index];
      if (!scene) return;
      if (viewer) {
        viewer.destroy();
        viewer = null;
      }
      viewer = pannellum.viewer('container', {
        type: 'equirectangular',
        panorama: 'images/' + scene.file,
        autoLoad: true,
        showZoomCtrl: true,
        showFullscreenCtrl: true,
        compass: true
      });
      document.getElementById('sceneName').textContent = scene.name;
      document.getElementById('counter').textContent = (index + 1) + '/' + scenes.length;
    }

    function showScene(index) {
      if (index < 0) index = scenes.length - 1;
      if (index >= scenes.length) index = 0;
      currentIndex = index;
      initViewer(currentIndex);
    }

    document.getElementById('prevBtn').addEventListener('click', function() {
      showScene(currentIndex - 1);
    });
    document.getElementById('nextBtn').addEventListener('click', function() {
      showScene(currentIndex + 1);
    });

    // Клавиатура
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowLeft') showScene(currentIndex - 1);
      else if (e.key === 'ArrowRight') showScene(currentIndex + 1);
    });

    // Запуск
    if (scenes.length > 0) {
      showScene(0);
    } else {
      document.getElementById('sceneName').textContent = 'Нет панорам';
    }
  </script>
</body>
</html>

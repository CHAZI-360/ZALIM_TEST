<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ТЕСТ РАКУРСОВ 3</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0b0b0b; color:#fff; font-family:'Segoe UI',sans-serif; }
    #panoContainer {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:#0a0a0a;
    }
    #panoContainer .pnlm-container { width:100% !important; height:100% !important; }
    .pnlm-zoom-controls { display:none !important; }
    .pnlm-container .pnlm-msg { display:none !important; }
    .pnlm-fullscreen-toggle-button {
      position: absolute !important;
      top: 48px !important;
      z-index: 200 !important;
    }
    #topBar {
      position:fixed; top:0; left:0; right:0; height:48px;
      background:#0a0a0a;
      border-bottom:1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; padding:0 20px;
      z-index:50;
      transition:opacity 0.3s ease;
      opacity:1;
      pointer-events:auto;
      gap:12px;
    }
    #topBar.hidden { opacity:0; pointer-events:none; }
    #topBar .brand {
      font-weight:600; font-size:16px; color:#b0b0b0; white-space:nowrap;
    }
    #topBar .brand .highlight { color:#6ab0f7; }
    #topBar .left-group {
      display:flex; align-items:center; gap:12px;
      flex:1;
    }
    #topBar .scene-name {
      flex:1;
      text-align:right;
      font-size:16px;
      font-weight:500;
      color:#eee;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding:0 10px;
      margin-left:auto;
    }
    #topBar .tour-name {
      font-size:14px;
      color:#aaa;
      white-space:nowrap;
    }
    #thumbnailsWrapper {
      position:fixed; bottom:0; left:0; right:0; height:160px;
      background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding:0 20px;
      z-index:50;
      transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      opacity:1;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      flex-direction:column;
    }
    #thumbnailsWrapper.panel-open {
      bottom: 195px;
    }
    #thumbnailsWrapper.hidden { opacity:0; pointer-events:none; }
    #thumbnailsWrapper .scroll-container {
      display:flex; gap:10px; overflow-x:auto; overflow-y:hidden;
      padding: 8px 10px 10px 10px;
      height:auto; max-height:100%;
      align-items:center; justify-content:flex-start;
      scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.25) transparent;
      width:100%; flex-wrap:nowrap;
    }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar { height:6px; }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.35); border-radius:4px; }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar-track { background:transparent; }
    #thumbnailsWrapper .scroll-container.centered { justify-content:center; }
    .thumbnail-item {
      flex:0 0 140px; height:98px;
      background:#1a1a1a; border-radius:10px;
      overflow:hidden; position:relative; cursor:pointer;
      border:2px solid transparent;
      transition:border .2s, transform .15s;
      display:flex; flex-direction:column; justify-content:flex-end;
      box-shadow:none; flex-shrink:0; margin-bottom:4px;
    }
    .thumbnail-item.active { border-color:#6ab0f7; }
    .thumbnail-item:hover { transform:scale(1.02); }
    .thumbnail-item img {
      position:absolute; top:0; left:0; width:100%; height:100%;
      object-fit:cover; pointer-events:none;
      image-rendering:-webkit-optimize-contrast;
    }
    .thumbnail-item .label {
      position:relative; z-index:2;
      background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
      padding:4px 8px; font-size:12px; font-weight:500;
      text-overflow:ellipsis; white-space:nowrap; overflow:hidden; width:100%;
      text-align:center; color:#eee; border-top:1px solid rgba(255,255,255,0.1);
      pointer-events:none;
    }
    .thumbnail-item .vp-btn {
      position:absolute; top:4px; left:50%; transform:translateX(-50%);
      z-index:5; background:rgba(106,176,247,0.9); color:#fff;
      border:none; border-radius:12px; padding:3px 10px; font-size:11px;
      font-weight:500; cursor:pointer; white-space:nowrap;
      opacity:0; transition:opacity .2s; pointer-events:auto;
    }
    .thumbnail-item:hover .vp-btn,
    .thumbnail-item.has-vp .vp-btn { opacity:1; }
    .thumbnail-item .vp-btn:hover { background:#5a9fd6; }
    #vpLightbox {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.92); z-index:20000; display:none;
      align-items:center; justify-content:center; opacity:0; transition:opacity 0.3s ease;
    }
    #vpLightbox.show { display:flex; opacity:1; }
    #vpLightbox .lb-inner {
      position:relative; width:100%; height:100%;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    #vpLightbox .lb-img-wrap {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      transition: opacity 0.25s ease;
    }
    #vpLightbox .lb-img-wrap img {
      max-width:95%; max-height:90%; object-fit:contain; border-radius:4px;
      box-shadow:0 8px 40px rgba(0,0,0,0.6); user-select:none; pointer-events:none;
    }
    #vpLightbox .lb-img-wrap.fade-out { opacity:0; }
    #vpLightbox .lb-img-wrap.fade-in { opacity:0; }
    #vpLightbox .lb-nav {
      position:absolute; top:50%; transform:translateY(-50%);
      width:48px; height:48px; background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.15); border-radius:50%;
      color:#fff; font-size:24px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s, opacity .2s; z-index:10; opacity:0.7;
    }
    #vpLightbox .lb-nav:hover { background:rgba(255,255,255,0.25); opacity:1; }
    #vpLightbox .lb-prev { left:20px; }
    #vpLightbox .lb-next { right:20px; }
    #vpLightbox .lb-close {
      position:absolute; top:16px; right:20px; width:40px; height:40px;
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
      border-radius:50%; color:#fff; font-size:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:10; transition:background .2s;
    }
    #vpLightbox .lb-close:hover { background:rgba(255,80,80,0.4); }
    #vpLightbox .lb-caption {
      position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.7); padding:8px 20px; border-radius:20px;
      font-size:15px; color:#eee; z-index:10; white-space:nowrap;
      border:1px solid rgba(255,255,255,0.1);
    }
    #vpLightbox .lb-counter {
      position:absolute; top:20px; left:50%; transform:translateX(-50%);
      font-size:14px; color:#aaa; z-index:10;
    }
    #globalTooltip {
      position:absolute;
      bottom:calc(100% + 10px);
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,0.85);
      color:#fff;
      padding:6px 16px;
      border-radius:8px;
      font-size:14px;
      font-weight:500;
      white-space:nowrap;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.2s;
      z-index:60;
      border:1px solid rgba(255,255,255,0.1);
    }
    #globalTooltip.visible { opacity:1; }
    @media (max-width:700px) {
      #topBar { height:40px; padding:0 12px; }
      #topBar .brand { font-size:14px; }
      #topBar .scene-name { font-size:14px; }
      #topBar .tour-name { font-size:12px; }
      #thumbnailsWrapper { height:130px; padding:0 12px; }
      .thumbnail-item { flex:0 0 100px; height:78px; }
      .thumbnail-item .label { font-size:10px; padding:2px 6px; }
    }

    /* ===== Миниатюры: кнопка + и счётчик ракурсов ===== */
    .thumbnail-item.dragover-vp {
      border-color:#6ab0f7 !important;
      box-shadow:0 0 0 3px rgba(106,176,247,0.45);
      transform:scale(1.04);
    }
    .thumbnail-item .vp-add-btn {
      position:absolute; top:4px; left:4px; z-index:4;
      background:rgba(0,0,0,0.7); border:none; border-radius:4px;
      color:#fff; width:22px; height:22px; font-size:14px;
      line-height:1; cursor:pointer; transition:background .2s, opacity .2s;
      display:flex; align-items:center; justify-content:center;
      opacity:0;
    }
    .thumbnail-item:hover .vp-add-btn { opacity:1; }
    .thumbnail-item .vp-add-btn:hover { background:rgba(106,176,247,0.6); }
    .thumbnail-wrap .vp-count {
      background:rgba(106,176,247,0.9); color:#fff;
      font-size:12px; font-weight:600; padding:2px 8px;
      border-radius:10px; line-height:1.3;
      pointer-events:none;
      opacity:0; transition:opacity .2s;
      min-width:20px; text-align:center;
      white-space:nowrap;
      flex-shrink:0;
    }
    .thumbnail-wrap.has-viewpoints .vp-count { opacity:1; }
    .thumbnail-wrap:not(.has-viewpoints) .vp-count {
      height:0; padding:0; overflow:hidden; opacity:0;
    }

    #thumbnailsWrapper {
      transition: bottom 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }
    #thumbnailsWrapper.panel-open {
      bottom: 195px;
    }

    /* ===== Нижняя панель ракурсов ===== */
    #viewpointsPanel {
      position:fixed;
      left:0; right:0; bottom:0;
      height:180px;
      background:rgba(15,15,15,0.96);
      backdrop-filter:blur(12px);
      z-index:55;
      transform:translateY(100%);
      transition:transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      display:flex;
      flex-direction:column;
      border-top:1px solid rgba(255,255,255,0.08);
      box-shadow:0 -4px 30px rgba(0,0,0,0.5);
    }
    #viewpointsPanel.open { transform:translateY(0); }

    #viewpointsPanelHeader {
      padding:8px 16px;
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
      border-bottom:1px solid rgba(255,255,255,0.06);
      height:40px;
    }
    #viewpointsPanelHeader .vp-title {
      flex:1;
      font-size:14px;
      font-weight:500;
      color:#ddd;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #viewpointsPanelHeader .vp-title span { color:#6ab0f7; }
    #viewpointsPanelHeader button {
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.1);
      color:#ddd;
      padding:4px 10px;
      border-radius:5px;
      font-size:12px;
      cursor:pointer;
      transition:background .2s, border-color .2s;
      white-space:nowrap;
    }
    #viewpointsPanelHeader button:hover {
      background:rgba(255,255,255,0.15);
      border-color:rgba(255,255,255,0.25);
    }
    #viewpointsPanelHeader .btn-close-vp {
      width:28px; height:28px; padding:0;
      display:flex; align-items:center; justify-content:center;
      font-size:16px;
    }

    #viewpointsList {
      flex:1;
      display:flex;
      gap:10px;
      overflow-x:auto;
      overflow-y:hidden;
      padding:10px 16px 16px 16px;
      align-items:center;
      scrollbar-width:thin;
      scrollbar-color:rgba(255,255,255,0.25) transparent;
    }
    #viewpointsList::-webkit-scrollbar { height:6px; }
    #viewpointsList::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.35); border-radius:4px; }
    #viewpointsList::-webkit-scrollbar-track { background:transparent; }
    #viewpointsList.centered { justify-content:center; }

    .viewpoint-wrap {
      flex:0 0 120px;
      position:relative;
      flex-shrink:0;
    }
    .viewpoint-item {
      width:100%; height:90px;
      background:#1a1a1a; border-radius:8px;
      overflow:hidden; position:relative; cursor:pointer;
      border:2px solid transparent;
      transition:border .2s, transform .15s;
      display:flex; flex-direction:column; justify-content:flex-end;
      flex-shrink:0;
    }
    .viewpoint-item:hover { transform:scale(1.03); }
    .viewpoint-item img {
      position:absolute; top:0; left:0; width:100%; height:100%;
      object-fit:cover; pointer-events:none;
    }
    .viewpoint-wrap .vp-number {
      color:#aaa;
      font-size:11px; font-weight:600;
      line-height:1.2;
      pointer-events:none;
      text-align:center;
      white-space:nowrap;
      flex-shrink:0;
    }
    .viewpoint-item .label-wrapper {
      position:relative; z-index:2;
      background:rgba(0,0,0,0.65); backdrop-filter:blur(4px);
      padding:3px 6px; font-size:11px; font-weight:500;
      width:100%; text-align:center; color:#eee;
      border-top:1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; justify-content:center; gap:3px;
      pointer-events:none;
    }
    .viewpoint-item .label-wrapper .label {
      flex:1; text-overflow:ellipsis; white-space:nowrap; overflow:hidden; min-width:0;
    }
    .viewpoint-item .label-wrapper .label[contenteditable="true"] {
      pointer-events:auto; background:rgba(0,0,0,0.85); outline:1px solid #6ab0f7;
      border-radius:3px; padding:0 3px;
      white-space:normal; overflow:visible; text-overflow:clip;
      word-break:break-word; max-width:100%;
    }
    .viewpoint-item .label-wrapper .edit-icon {
      pointer-events:auto; opacity:0.5; font-size:9px; cursor:pointer; flex-shrink:0;
    }
    .viewpoint-item .label-wrapper .edit-icon:hover { opacity:1; }
    .viewpoint-item .actions {
      position:absolute; top:3px; right:3px; display:flex; gap:3px;
      z-index:3; opacity:0; transition:opacity .2s;
    }
    .viewpoint-item:hover .actions { opacity:1; }
    .viewpoint-item .actions button {
      background:rgba(0,0,0,0.7); border:none; border-radius:3px;
      color:#fff; width:20px; height:20px; font-size:11px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .viewpoint-item .actions button:hover { background:rgba(255,255,255,0.25); }
    .viewpoint-item .actions .btn-delete { color:#ff6b6b; }
    .viewpoint-item .actions .btn-delete:hover { background:rgba(255,80,80,0.4); }

    #vpEmptyMsg {
      color:#666; font-size:14px; text-align:center; width:100%;
      padding:20px; display:none;
    }
    #vpEmptyMsg.show { display:block; }

    /* ===== Lightbox ===== */
    #vpLightbox {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:rgba(0,0,0,0.92);
      z-index:20000;
      display:none;
      align-items:center;
      justify-content:center;
      opacity:0;
      transition:opacity 0.3s ease;
    }
    #vpLightbox.show { display:flex; opacity:1; }
    #vpLightbox .lb-inner {
      position:relative; width:100%; height:100%;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    #vpLightbox .lb-img-wrap {
      position:absolute; top:0; left:0; right:0; bottom:0;
      display:flex; align-items:center; justify-content:center;
      transition: opacity 0.25s ease;
    }
    #vpLightbox .lb-img-wrap img {
      max-width:95%; max-height:90%; object-fit:contain; border-radius:4px;
      box-shadow:0 8px 40px rgba(0,0,0,0.6); user-select:none; pointer-events:none;
    }
    #vpLightbox .lb-img-wrap.fade-out { opacity:0; }
    #vpLightbox .lb-img-wrap.fade-in { opacity:0; }
    #vpLightbox .lb-nav {
      position:absolute; top:50%; transform:translateY(-50%);
      width:48px; height:48px; background:rgba(255,255,255,0.1);
      border:1px solid rgba(255,255,255,0.15); border-radius:50%;
      color:#fff; font-size:24px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s, opacity .2s; z-index:10; opacity:0.7;
    }
    #vpLightbox .lb-nav:hover { background:rgba(255,255,255,0.25); opacity:1; }
    #vpLightbox .lb-prev { left:20px; }
    #vpLightbox .lb-next { right:20px; }
    #vpLightbox .lb-close {
      position:absolute; top:16px; right:20px; width:40px; height:40px;
      background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15);
      border-radius:50%; color:#fff; font-size:20px; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:10; transition:background .2s;
    }
    #vpLightbox .lb-close:hover { background:rgba(255,80,80,0.4); }
    #vpLightbox .lb-caption {
      position:absolute; bottom:24px; left:50%; transform:translateX(-50%);
      background:rgba(0,0,0,0.7); padding:8px 20px; border-radius:20px;
      font-size:15px; color:#eee; z-index:10; white-space:nowrap;
      border:1px solid rgba(255,255,255,0.1);
    }
    #vpLightbox .lb-counter {
      position:absolute; top:20px; left:50%; transform:translateX(-50%);
      font-size:14px; color:#aaa; z-index:10;
    }

    @media (max-width:700px) {
      #thumbnailsWrapper.panel-open { bottom:175px; }
      #viewpointsPanel { height:175px; }
      .viewpoint-wrap { flex:0 0 100px; width:100px; }
      .viewpoint-item { width:100px; height:75px; }
      #vpLightbox .lb-nav { width:40px; height:40px; font-size:20px; }
      #vpLightbox .lb-prev { left:10px; }
      #vpLightbox .lb-next { right:10px; }
      .thumbnail-item .vp-btn { font-size:10px; padding:2px 8px; }
    }

  </style>
</head>
<body>
  <div id="panoContainer"></div>
  <div id="topBar">
    <div class="left-group">
      <div class="brand">CHAZI<span class="highlight">360</span></div>
      <span class="tour-name" id="tourNameDisplay">ТЕСТ РАКУРСОВ 3</span>
    </div>
    <div class="scene-name" id="sceneNameDisplay">Загрузка панорам...</div>
  </div>
  <div id="thumbnailsWrapper">
    <div id="globalTooltip"></div>
    <div class="scroll-container" id="thumbnailsList"></div>
  </div>
  <div id="vpLightbox">
    <div class="lb-inner">

      <button class="lb-nav lb-next" id="lbNext">›</button>
      <button class="lb-close" id="lbClose">✕</button>
      <div class="lb-counter" id="lbCounter"></div>
      <div class="lb-caption" id="lbCaption"></div>
    </div>
  </div>

      let currentSceneId = null;

      let isVisible = true;
      let mouseDownTime = 0;
      let lbViewpoints = [];
      let lbIndex = 0;
      let lbAnimating = false;
      const panoContainer = document.getElementById('panoContainer');
      const thumbnailsWrapper = document.getElementById('thumbnailsWrapper');
      const thumbnailsList = document.getElementById('thumbnailsList');
      const topBar = document.getElementById('topBar');
      const vpLightbox = document.getElementById('vpLightbox');
      const lbImgWrap = document.getElementById('lbImgWrap');
      const lbImage = document.getElementById('lbImage');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      const lbClose = document.getElementById('lbClose');

      const sceneNameDisplay = document.getElementById('sceneNameDisplay');
      const tourNameDisplay = document.getElementById('tourNameDisplay');
      const globalTooltip = document.getElementById('globalTooltip');

      function showPanels() {
        thumbnailsWrapper.classList.remove('hidden');
        topBar.classList.remove('hidden');
        isVisible = true;
      }
      function hidePanels() {
        thumbnailsWrapper.classList.add('hidden');
        topBar.classList.add('hidden');
        isVisible = false;
      }
      function togglePanels() {
        if (isVisible) hidePanels();
        else showPanels();
      }

      panoContainer.addEventListener('mousedown', () => mouseDownTime = Date.now());
      panoContainer.addEventListener('mouseup', function(e) {
        if (e.target.closest('.pnlm-controls') || e.target.closest('#thumbnailsWrapper')) return;
        if (Date.now() - mouseDownTime < 100) togglePanels();
      });

      thumbnailsWrapper.addEventListener('wheel', function(e) {
        const container = thumbnailsList;
        if (container.scrollWidth > container.clientWidth) {
          e.preventDefault();
          container.scrollLeft += e.deltaY * 0.8;
        }
      }, { passive: false });

      function showGlobalTooltip(text) {
        globalTooltip.textContent = text || '';
        globalTooltip.classList.toggle('visible', !!text);
      }
      document.addEventListener('mouseover', e => {
        const item = e.target.closest('.thumbnail-item');
        if (item) showGlobalTooltip(item.dataset.fullname || '');
      });
      document.addEventListener('mouseout', e => {
        if (!e.relatedTarget || !e.relatedTarget.closest('.thumbnail-item')) showGlobalTooltip('');
      });

      topBar.addEventListener('dblclick', function(e) {
        if (e.target.closest('.brand') || e.target.closest('.tour-name') || e.target.closest('.scene-name')) return;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {});
        } else {
          document.exitFullscreen().catch(err => {});
        }
      });

      function showPanorama(url) {
        if (!url) {
          if (viewer) viewer.destroy();
          return;
        }
        if (viewer) viewer.destroy();
        viewer = pannellum.viewer('panoContainer', {
          type: 'equirectangular',
          panorama: url,
          autoLoad: true,
          showZoomCtrl: true,
          showFullscreenCtrl: true,
          keyboardZoom: true,
          mouseZoom: true,
          compass: false,
          doubleClick: false
        });
      }

      function switchToScene(sceneId) {
        const scene = manifest.scenes.find(s => s.id === sceneId);
        if (!scene) {
          if (manifest.scenes.length > 0) {
            switchToScene(manifest.scenes[0].id);
          }
          return;
        }
        showPanorama(scene.file);
        currentSceneId = sceneId;
        sceneNameDisplay.textContent = scene.name || 'Без названия';
        updateThumbnails();
        showPanels();
      }

      function updateThumbnails() {
        thumbnailsList.innerHTML = '';
        if (manifest.scenes.length === 0) {
          hidePanels();
          return;
        }
        manifest.scenes.forEach((scene) => {
          const item = document.createElement('div');
          item.className = 'thumbnail-item';
          if (scene.id === currentSceneId) item.classList.add('active');
          item.dataset.sceneId = scene.id;
          item.dataset.fullname = scene.name;
          const img = document.createElement('img');
          img.src = scene.thumbnail || scene.file;
          img.alt = scene.name;
          img.loading = 'lazy';
          item.appendChild(img);
          if (scene.viewpoints && scene.viewpoints.length > 0) {
            item.classList.add('has-vp');
            const vpBtn = document.createElement('button');
            vpBtn.className = 'vp-btn';
            vpBtn.textContent = 'Просмотр ракурсов';
            vpBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              openLightbox(scene.viewpoints, 0);
            });
            item.appendChild(vpBtn);
          }
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = scene.name;
          item.appendChild(label);
          item.addEventListener('click', function(e) {
            if (e.target.closest('.vp-btn')) return;
            switchToScene(this.dataset.sceneId);
          });
          thumbnailsList.appendChild(item);
        });
        const container = thumbnailsList;
        if (container.scrollWidth <= container.clientWidth) {
          container.classList.add('centered');
        } else {
          container.classList.remove('centered');
        }
        showPanels();
      }

      function openLightbox(viewpoints, startIndex) {
        if (!viewpoints || !viewpoints.length) return;
        lbViewpoints = viewpoints;
        lbIndex = Math.max(0, Math.min(startIndex, viewpoints.length - 1));
        lbAnimating = false;
        showLbImage(false);
        vpLightbox.classList.add('show');
        document.addEventListener('keydown', lbKeyHandler);
      }
      function closeLightbox() {
        vpLightbox.classList.remove('show');
        document.removeEventListener('keydown', lbKeyHandler);
        lbViewpoints = [];
      }
      function showLbImage(animate, direction) {
        if (!lbViewpoints.length) return;
        const vp = lbViewpoints[lbIndex];
        lbCounter.textContent = (lbIndex + 1) + ' / ' + lbViewpoints.length;
        lbCaption.textContent = vp.name || 'Ракурс';
        if (!animate) {
          lbImage.src = vp.file;
          lbImgWrap.className = 'lb-img-wrap';
          return;
        }
        lbAnimating = true;
        lbImgWrap.classList.add('fade-out');
        setTimeout(function() {
          lbImage.src = vp.file;
          lbImgWrap.className = 'lb-img-wrap fade-in';
          void lbImgWrap.offsetWidth;
          lbImgWrap.className = 'lb-img-wrap';
          setTimeout(function() { lbAnimating = false; }, 250);
        }, 200);
      }
      function goLbNext() {
        if (lbAnimating || lbViewpoints.length < 2) return;
        lbIndex = (lbIndex + 1) % lbViewpoints.length;
        showLbImage(true, 'next');
      }
      function goLbPrev() {
        if (lbAnimating || lbViewpoints.length < 2) return;
        lbIndex = (lbIndex - 1 + lbViewpoints.length) % lbViewpoints.length;
        showLbImage(true, 'prev');
      }
      function lbKeyHandler(e) {
        if (e.key === 'Escape') closeLightbox();
        else if (e.key === 'ArrowRight') goLbNext();
        else if (e.key === 'ArrowLeft') goLbPrev();
      }
      lbClose.addEventListener('click', closeLightbox);
      lbNext.addEventListener('click', goLbNext);
      lbPrev.addEventListener('click', goLbPrev);
      vpLightbox.addEventListener('click', function(e) {
        if (e.target === vpLightbox || e.target.classList.contains('lb-inner')) closeLightbox();
      });
      let touchStartX = 0;
      lbImgWrap.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
      lbImgWrap.addEventListener('touchend', function(e) {
        const dx = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(dx) > 50) { if (dx < 0) goLbNext(); else goLbPrev(); }
      }, { passive: true });

      tourNameDisplay.textContent = manifest.name || 'Тур';
      if (manifest.scenes.length > 0) {
        switchToScene(manifest.scenes[0].id);
      } else {
        sceneNameDisplay.textContent = 'Нет панорам';
        hidePanels();
      }
      updateThumbnails();
    })();
  </script>
</body>
</html>

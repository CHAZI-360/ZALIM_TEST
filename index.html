<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Новый тур 2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0b0b0b; color:#fff; font-family:'Segoe UI',sans-serif; }
    #panoContainer {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:#0a0a0a;
    }
    #panoContainer .pnlm-container { width:100% !important; height:100% !important; }
    .pnlm-zoom-controls { display:none !important; }
    .pnlm-container .pnlm-msg { display:none !important; }
    #topBar {
      position:fixed; top:0; left:0; right:0; height:48px;
      background:rgba(10,10,10,0.8); backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; padding:0 20px;
      z-index:50;
      transition:opacity 0.3s ease;
      opacity:1;
      pointer-events:auto;
      gap:12px;
    }
    #topBar.hidden { opacity:0; pointer-events:none; }
    #topBar .brand {
      font-weight:600; font-size:16px; color:#b0b0b0; white-space:nowrap;
    }
    #topBar .brand .highlight { color:#6ab0f7; }
    #topBar .left-group {
      display:flex; align-items:center; gap:12px;
      flex:1;
    }
    #topBar .scene-name {
      flex:1;
      text-align:right;
      font-size:16px;
      font-weight:500;
      color:#eee;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      padding:0 10px;
      margin-left:auto;
    }
    #topBar .tour-name {
      font-size:14px;
      color:#aaa;
      white-space:nowrap;
    }
    #thumbnailsWrapper {
      position:fixed; bottom:0; left:0; right:0; height:160px;
      background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding:0 20px;
      z-index:50;
      transition:opacity 0.3s ease;
      opacity:1;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      flex-direction:column;
    }
    #thumbnailsWrapper.hidden { opacity:0; pointer-events:none; }
    #thumbnailsWrapper .scroll-container {
      display:flex; gap:10px; overflow-x:auto; overflow-y:hidden;
      padding: 8px 10px 10px 10px;
      height:auto; max-height:100%;
      align-items:center; justify-content:flex-start;
      scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.25) transparent;
      width:100%; flex-wrap:nowrap;
    }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar { height:6px; }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.35); border-radius:4px; }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar-track { background:transparent; }
    #thumbnailsWrapper .scroll-container.centered { justify-content:center; }
    .thumbnail-item {
      flex:0 0 140px; height:98px;
      background:#1a1a1a; border-radius:10px;
      overflow:hidden; position:relative; cursor:pointer;
      border:2px solid transparent;
      transition:border .2s, transform .15s;
      display:flex; flex-direction:column; justify-content:flex-end;
      box-shadow:none; flex-shrink:0; margin-bottom:4px;
    }
    .thumbnail-item.active { border-color:#6ab0f7; }
    .thumbnail-item:hover { transform:scale(1.02); }
    .thumbnail-item img {
      position:absolute; top:0; left:0; width:100%; height:100%;
      object-fit:cover; pointer-events:none;
      image-rendering:-webkit-optimize-contrast;
    }
    .thumbnail-item .label {
      position:relative; z-index:2;
      background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
      padding:4px 8px; font-size:12px; font-weight:500;
      text-overflow:ellipsis; white-space:nowrap; overflow:hidden; width:100%;
      text-align:center; color:#eee; border-top:1px solid rgba(255,255,255,0.1);
      pointer-events:none;
    }
    #globalTooltip {
      position:absolute;
      bottom:calc(100% + 10px);
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,0.85);
      color:#fff;
      padding:6px 16px;
      border-radius:8px;
      font-size:14px;
      font-weight:500;
      white-space:nowrap;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.2s;
      z-index:60;
      border:1px solid rgba(255,255,255,0.1);
    }
    #globalTooltip.visible { opacity:1; }
    @media (max-width:700px) {
      #topBar { height:40px; padding:0 12px; }
      #topBar .brand { font-size:14px; }
      #topBar .scene-name { font-size:14px; }
      #topBar .tour-name { font-size:12px; }
      #thumbnailsWrapper { height:130px; padding:0 12px; }
      .thumbnail-item { flex:0 0 100px; height:78px; }
      .thumbnail-item .label { font-size:10px; padding:2px 6px; }
    }
  </style>
</head>
<body>
  <div id="panoContainer"></div>
  <div id="topBar">
    <div class="left-group">
      <div class="brand">CHAZI<span class="highlight">360</span></div>
      <span class="tour-name" id="tourNameDisplay">Новый тур 2</span>
    </div>
    <div class="scene-name" id="sceneNameDisplay">Загрузка панорам...</div>
  </div>
  <div id="thumbnailsWrapper">
    <div id="globalTooltip"></div>
    <div class="scroll-container" id="thumbnailsList"></div>
  </div>
  <script>
    (function() {
      const manifest = {"name":"Новый тур 2","scenes":[{"id":"ms0mcz8t5ewk6","name":"Corona_Camera001_0000","file":"images/scene_1.jpg","thumbnail":"thumbnails/scene_1.jpg"},{"id":"ms0mczitx6vq4","name":"Corona_Camera_360_003_АКТУАЛЬНОЕ","file":"images/scene_2.jpg","thumbnail":"thumbnails/scene_2.jpg"},{"id":"ms0md02gmi8oj","name":"Camera_360_03","file":"images/scene_3.jpg","thumbnail":"thumbnails/scene_3.jpg"},{"id":"ms0md06ijdl5o","name":"Camera_360_01","file":"images/scene_4.jpg","thumbnail":"thumbnails/scene_4.jpg"},{"id":"ms0md0pupfc80","name":"Corona_Camera005_0000","file":"images/scene_5.jpg","thumbnail":"thumbnails/scene_5.jpg"},{"id":"ms0md09wlmthh","name":"Corona_Camera002_0000","file":"images/scene_6.jpg","thumbnail":"thumbnails/scene_6.jpg"},{"id":"ms0md0fuj995f","name":"Corona_Camera004_0000","file":"images/scene_7.jpg","thumbnail":"thumbnails/scene_7.jpg"},{"id":"ms0md0vv96m42","name":"Холл_2_этаж - Кам 360 - 02","file":"images/scene_8.jpg","thumbnail":"thumbnails/scene_8.jpg"},{"id":"ms0mczr15eqyr","name":"Corona_Camera_360_2","file":"images/scene_9.jpg","thumbnail":"thumbnails/scene_9.jpg"},{"id":"ms0md0z90l70a","name":"Camera_360_02","file":"images/scene_10.jpg","thumbnail":"thumbnails/scene_10.jpg"},{"id":"ms0md153xej9j","name":"Corona_Camera_360_1","file":"images/scene_11.jpg","thumbnail":"thumbnails/scene_11.jpg"},{"id":"ms0md1baash2c","name":"Corona_Camera_360_006_АКТУАЛЬНОЕ","file":"images/scene_12.jpg","thumbnail":"thumbnails/scene_12.jpg"},{"id":"ms0md1f61s4jd","name":"Corona_Camera003_0000","file":"images/scene_13.jpg","thumbnail":"thumbnails/scene_13.jpg"},{"id":"ms0md1ixp4jhd","name":"Corona_Camera_360_001_АКТУАЛЬНОЕ","file":"images/scene_14.jpg","thumbnail":"thumbnails/scene_14.jpg"},{"id":"ms0md1nbunvo7","name":"Холл_2_этаж - Кам 360 - 01","file":"images/scene_15.jpg","thumbnail":"thumbnails/scene_15.jpg"},{"id":"ms0md1r2sal3f","name":"Corona_Camera_360_002_АКТУАЛЬНОЕ","file":"images/scene_16.jpg","thumbnail":"thumbnails/scene_16.jpg"},{"id":"ms0md1v1giks7","name":"Холл_2_этаж - Кам 360 - 03","file":"images/scene_17.jpg","thumbnail":"thumbnails/scene_17.jpg"}]};
      let currentSceneId = null;
      let viewer = null;
      let isVisible = true;
      let mouseDownTime = 0;
      const panoContainer = document.getElementById('panoContainer');
      const thumbnailsWrapper = document.getElementById('thumbnailsWrapper');
      const thumbnailsList = document.getElementById('thumbnailsList');
      const topBar = document.getElementById('topBar');
      const sceneNameDisplay = document.getElementById('sceneNameDisplay');
      const tourNameDisplay = document.getElementById('tourNameDisplay');
      const globalTooltip = document.getElementById('globalTooltip');

      function showPanels() {
        thumbnailsWrapper.classList.remove('hidden');
        topBar.classList.remove('hidden');
        isVisible = true;
      }
      function hidePanels() {
        thumbnailsWrapper.classList.add('hidden');
        topBar.classList.add('hidden');
        isVisible = false;
      }
      function togglePanels() {
        if (isVisible) hidePanels();
        else showPanels();
      }

      panoContainer.addEventListener('mousedown', () => mouseDownTime = Date.now());
      panoContainer.addEventListener('mouseup', function(e) {
        if (e.target.closest('.pnlm-controls') || e.target.closest('#thumbnailsWrapper')) return;
        if (Date.now() - mouseDownTime < 100) togglePanels();
      });

      thumbnailsWrapper.addEventListener('wheel', function(e) {
        const container = thumbnailsList;
        if (container.scrollWidth > container.clientWidth) {
          e.preventDefault();
          container.scrollLeft += e.deltaY * 0.8;
        }
      }, { passive: false });

      function showGlobalTooltip(text) {
        globalTooltip.textContent = text || '';
        globalTooltip.classList.toggle('visible', !!text);
      }
      document.addEventListener('mouseover', e => {
        const item = e.target.closest('.thumbnail-item');
        if (item) showGlobalTooltip(item.dataset.fullname || '');
      });
      document.addEventListener('mouseout', e => {
        if (!e.relatedTarget || !e.relatedTarget.closest('.thumbnail-item')) showGlobalTooltip('');
      });

      topBar.addEventListener('dblclick', function(e) {
        if (e.target.closest('.brand') || e.target.closest('.tour-name') || e.target.closest('.scene-name')) return;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {});
        } else {
          document.exitFullscreen().catch(err => {});
        }
      });

      function showPanorama(url) {
        if (!url) {
          if (viewer) viewer.destroy();
          return;
        }
        if (viewer) viewer.destroy();
        viewer = pannellum.viewer('panoContainer', {
          type: 'equirectangular',
          panorama: url,
          autoLoad: true,
          showZoomCtrl: true,
          showFullscreenCtrl: true,
          keyboardZoom: true,
          mouseZoom: true,
          compass: false,
          doubleClick: false
        });
      }

      function switchToScene(sceneId) {
        const scene = manifest.scenes.find(s => s.id === sceneId);
        if (!scene) {
          if (manifest.scenes.length > 0) {
            switchToScene(manifest.scenes[0].id);
          }
          return;
        }
        showPanorama(scene.file);
        currentSceneId = sceneId;
        sceneNameDisplay.textContent = scene.name || 'Без названия';
        updateThumbnails();
        showPanels();
      }

      function updateThumbnails() {
        thumbnailsList.innerHTML = '';
        if (manifest.scenes.length === 0) {
          hidePanels();
          return;
        }
        manifest.scenes.forEach((scene) => {
          const item = document.createElement('div');
          item.className = 'thumbnail-item';
          if (scene.id === currentSceneId) item.classList.add('active');
          item.dataset.sceneId = scene.id;
          item.dataset.fullname = scene.name;
          const img = document.createElement('img');
          img.src = scene.thumbnail || scene.file;
          img.alt = scene.name;
          img.loading = 'lazy';
          item.appendChild(img);
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = scene.name;
          item.appendChild(label);
          item.addEventListener('click', function(e) {
            switchToScene(this.dataset.sceneId);
          });
          thumbnailsList.appendChild(item);
        });
        const container = thumbnailsList;
        if (container.scrollWidth <= container.clientWidth) {
          container.classList.add('centered');
        } else {
          container.classList.remove('centered');
        }
        showPanels();
      }

      tourNameDisplay.textContent = manifest.name || 'Тур';
      if (manifest.scenes.length > 0) {
        initViewer();
        switchToScene(manifest.scenes[0].id);
      } else {
        sceneNameDisplay.textContent = 'Нет панорам';
        hidePanels();
      }
      updateThumbnails();
    })();
  </script>
</body>
</html>

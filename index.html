<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Новый тур</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css" />
  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    html, body { width:100%; height:100%; overflow:hidden; background:#0b0b0b; color:#fff; font-family:'Segoe UI',sans-serif; }
    #panoContainer {
      position:fixed; top:0; left:0; right:0; bottom:0;
      background:#0a0a0a;
    }
    #panoContainer .pnlm-container { width:100% !important; height:100% !important; }
    .pnlm-zoom-controls { display:none !important; }
    .pnlm-fullscreen-toggle-button {
      position:absolute !important;
      top:20px !important;
      right:20px !important;
      left:auto !important;
      background:rgba(0,0,0,0.6) !important;
      border-radius:8px !important;
      padding:8px 12px !important;
      color:#fff !important;
      font-size:22px !important;
      cursor:pointer;
      z-index:200 !important;
      border:1px solid rgba(255,255,255,0.2) !important;
    }
    .pnlm-fullscreen-toggle-button:hover {
      background:rgba(0,0,0,0.8) !important;
    }
    .pnlm-container .pnlm-msg { display:none !important; }

    #topBar {
      position:fixed; top:0; left:0; right:0; height:48px;
      background:rgba(10,10,10,0.8); backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,0.08);
      display:flex; align-items:center; padding:0 20px;
      z-index:50;
      transition:opacity 0.3s ease;
      opacity:1;
      pointer-events:auto;
      gap:20px;
    }
    #topBar.hidden { opacity:0; pointer-events:none; }
    #topBar .brand { font-weight:600; font-size:16px; color:#b0b0b0; white-space:nowrap; }
    #topBar .brand .highlight { color:#6ab0f7; }
    #topBar .scene-name { flex:1; text-align:center; font-size:16px; font-weight:500; color:#eee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 10px; }
    #topBar .tour-name { font-size:14px; color:#aaa; white-space:nowrap; }

    #thumbnailsWrapper {
      position:fixed; bottom:0; left:0; right:0; height:160px;
      background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      padding:0 20px;
      z-index:50;
      transition:opacity 0.3s ease;
      opacity:1;
      display:flex;
      align-items:center;
      justify-content:center;
      pointer-events:auto;
      flex-direction:column;
    }
    #thumbnailsWrapper.hidden { opacity:0; pointer-events:none; }
    #thumbnailsWrapper .scroll-container {
      display:flex; gap:10px; overflow-x:auto; overflow-y:hidden;
      padding:0 10px;
      height:auto; max-height:100%;
      align-items:center;
      justify-content:flex-start; /* изменено с center на flex-start */
      scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.2) transparent;
      width:100%; flex-wrap:nowrap;
    }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar { height:4px; }
    #thumbnailsWrapper .scroll-container::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.3); border-radius:4px; }
    #thumbnailsWrapper .scroll-container.centered {
      justify-content:center;
    }
    #globalTooltip {
      position:absolute;
      bottom:calc(100% + 10px);
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,0.85);
      color:#fff;
      padding:6px 16px;
      border-radius:8px;
      font-size:14px;
      font-weight:500;
      white-space:nowrap;
      pointer-events:none;
      opacity:0;
      transition:opacity 0.2s;
      z-index:60;
      border:1px solid rgba(255,255,255,0.1);
    }
    #globalTooltip.visible { opacity:1; }
    .thumbnail-item {
      flex:0 0 140px; height:100px; background:#1a1a1a; border-radius:10px;
      overflow:hidden; position:relative; cursor:pointer;
      border:2px solid transparent;
      transition:border .2s, transform .15s;
      display:flex; flex-direction:column; justify-content:flex-end;
      box-shadow:none;
      flex-shrink:0;
    }
    .thumbnail-item.active { border-color:#6ab0f7; box-shadow:none; }
    .thumbnail-item:hover { transform:scale(1.02); }
    .thumbnail-item img {
      position:absolute; top:0; left:0; width:100%; height:100%;
      object-fit:cover; pointer-events:none;
    }
    .thumbnail-item .label {
      position:relative; z-index:2;
      background:rgba(0,0,0,0.6); backdrop-filter:blur(4px);
      padding:4px 8px; font-size:12px; font-weight:500;
      text-overflow:ellipsis; white-space:nowrap; overflow:hidden; width:100%;
      text-align:center; color:#eee; border-top:1px solid rgba(255,255,255,0.1);
      pointer-events:none;
    }
    .empty-message { color:#666; font-size:14px; padding:20px; text-align:center; width:100%; }
    @media (max-width:700px) {
      #topBar { height:40px; padding:0 12px; }
      #topBar .brand { font-size:14px; }
      #topBar .scene-name { font-size:14px; }
      #topBar .tour-name { font-size:12px; }
      #thumbnailsWrapper { height:130px; padding:0 12px; }
      .thumbnail-item { flex:0 0 100px; height:80px; }
      .thumbnail-item .label { font-size:10px; padding:2px 6px; }
      #globalTooltip { font-size:12px; padding:4px 12px; }
    }
  </style>
</head>
<body>
  <div id="panoContainer"></div>

  <div id="topBar">
    <div class="brand">CHAZI<span class="highlight">360</span></div>
    <div class="scene-name" id="sceneNameDisplay">Загрузка панорам...</div>
    <div class="tour-name" id="tourNameDisplay">Новый тур</div>
  </div>

  <div id="thumbnailsWrapper">
    <div id="globalTooltip"></div>
    <div class="scroll-container" id="thumbnailsList"></div>
  </div>

  <script>
    (function() {
      const manifest = {"name":"Новый тур","scenes":[{"id":"mrzfxsu6oq2ap","name":"Corona_Camera004_0000","file":"images/scene_1.jpg"},{"id":"mrzfxsus53kaa","name":"Холл_2_этаж - Кам 360 - 01","file":"images/scene_2.jpg"},{"id":"mrzfxsv8978ji","name":"Corona_Camera005_0000","file":"images/scene_3.jpg"},{"id":"mrzfxsvqsn3h5","name":"Холл_2_этаж - Кам 360 - 02","file":"images/scene_4.jpg"},{"id":"mrzfxswblkp56","name":"Холл_2_этаж - Кам 360 - 03","file":"images/scene_5.jpg"},{"id":"mrzfy6wae9l71","name":"Camera_360_02","file":"images/scene_6.jpg"},{"id":"mrzfy6wp1c9av","name":"Camera_360_03","file":"images/scene_7.jpg"},{"id":"mrzfy6x6krc2l","name":"Corona_Camera_360_1","file":"images/scene_8.jpg"},{"id":"mrzfy6xo3t5tl","name":"Camera_360_01","file":"images/scene_9.jpg"},{"id":"mrzfy6y7ij04r","name":"Corona_Camera_360_001_АКТУАЛЬНОЕ","file":"images/scene_10.jpg"},{"id":"mrzfycekqnx7g","name":"Corona_Camera_360_2","file":"images/scene_11.jpg"},{"id":"mrzfycf3b3bbo","name":"Corona_Camera001_0000","file":"images/scene_12.jpg"},{"id":"mrzfycfms913a","name":"Corona_Camera_360_003_АКТУАЛЬНОЕ","file":"images/scene_13.jpg"},{"id":"mrzfycg5dmjh0","name":"Corona_Camera_360_006_АКТУАЛЬНОЕ","file":"images/scene_14.jpg"}]};
      let currentSceneId = null;
      let viewer = null;
      let isVisible = true;

      const panoContainer = document.getElementById('panoContainer');
      const thumbnailsWrapper = document.getElementById('thumbnailsWrapper');
      const thumbnailsList = document.getElementById('thumbnailsList');
      const topBar = document.getElementById('topBar');
      const sceneNameDisplay = document.getElementById('sceneNameDisplay');
      const tourNameDisplay = document.getElementById('tourNameDisplay');
      const globalTooltip = document.getElementById('globalTooltip');

      function showPanels() {
        thumbnailsWrapper.classList.remove('hidden');
        topBar.classList.remove('hidden');
        isVisible = true;
      }

      function hidePanels() {
        thumbnailsWrapper.classList.add('hidden');
        topBar.classList.add('hidden');
        isVisible = false;
      }

      function togglePanels() {
        if (isVisible) {
          hidePanels();
        } else {
          showPanels();
        }
      }

      panoContainer.addEventListener('click', function(e) {
        if (e.target.closest('.pnlm-controls')) return;
        if (e.target.closest('#thumbnailsWrapper')) return;
        togglePanels();
      });

      function showGlobalTooltip(text) {
        if (!text) { globalTooltip.classList.remove('visible'); return; }
        globalTooltip.textContent = text;
        globalTooltip.classList.add('visible');
      }
      document.addEventListener('mouseover', function(e) {
        const item = e.target.closest('.thumbnail-item');
        if (item) {
          const fullName = item.dataset.fullname || '';
          showGlobalTooltip(fullName);
        }
      });
      document.addEventListener('mouseout', function(e) {
        const item = e.target.closest('.thumbnail-item');
        if (item) {
          const related = e.relatedTarget;
          if (!related || !related.closest('.thumbnail-item')) {
            showGlobalTooltip('');
          }
        }
      });

      panoContainer.addEventListener('dblclick', function(e) {
        if (e.target.closest('.pnlm-controls') || e.target.closest('.thumbnail-item')) return;
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => {});
        } else {
          document.exitFullscreen().catch(err => {});
        }
      });

      function initViewer() {
        if (viewer) {
          viewer.destroy();
          viewer = null;
        }
        try {
          viewer = pannellum.viewer('panoContainer', {
            type: 'equirectangular',
            panorama: '',
            autoLoad: false,
            showZoomCtrl: false,
            showFullscreenCtrl: true,
            keyboardZoom: false,
            mouseZoom: true,
            compass: false,
            doubleClick: false
          });
          setTimeout(() => {
            const fsBtn = document.querySelector('.pnlm-fullscreen-toggle-button');
            if (fsBtn) {
              fsBtn.style.display = 'block';
              fsBtn.style.visibility = 'visible';
            }
          }, 100);
        } catch(e) {
          console.error('Ошибка инициализации Pannellum:', e);
        }
      }

      function showPanorama(url) {
        if (!url) {
          if (viewer) { viewer.destroy(); viewer = null; }
          return;
        }
        if (viewer) { viewer.destroy(); viewer = null; }
        try {
          viewer = pannellum.viewer('panoContainer', {
            type: 'equirectangular',
            panorama: url,
            autoLoad: true,
            showZoomCtrl: false,
            showFullscreenCtrl: true,
            keyboardZoom: false,
            mouseZoom: true,
            compass: false,
            doubleClick: false
          });
          setTimeout(() => {
            const fsBtn = document.querySelector('.pnlm-fullscreen-toggle-button');
            if (fsBtn) {
              fsBtn.style.display = 'block';
              fsBtn.style.visibility = 'visible';
            }
          }, 100);
        } catch(e) {
          console.error('Ошибка загрузки панорамы:', e);
        }
      }

      function switchToScene(sceneId) {
        const scene = manifest.scenes.find(s => s.id === sceneId);
        if (!scene) {
          if (manifest.scenes.length > 0) {
            switchToScene(manifest.scenes[0].id);
          }
          return;
        }
        showPanorama(scene.file);
        currentSceneId = sceneId;
        sceneNameDisplay.textContent = scene.name || 'Без названия';
        updateThumbnails();
        showPanels();
      }

      function updateThumbnails() {
        thumbnailsList.innerHTML = '';
        if (manifest.scenes.length === 0) {
          hidePanels();
          return;
        }
        manifest.scenes.forEach((scene) => {
          const item = document.createElement('div');
          item.className = 'thumbnail-item';
          if (scene.id === currentSceneId) item.classList.add('active');
          item.dataset.sceneId = scene.id;
          item.dataset.fullname = scene.name;

          const img = document.createElement('img');
          img.src = scene.file;
          img.alt = scene.name;
          img.draggable = false;
          item.appendChild(img);

          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = scene.name;
          item.appendChild(label);

          item.addEventListener('click', function(e) {
            const sid = this.dataset.sceneId;
            if (sid) switchToScene(sid);
          });

          thumbnailsList.appendChild(item);
        });

        // Центрирование, если не переполнено
        if (thumbnailsList.scrollWidth <= thumbnailsList.clientWidth) {
          thumbnailsList.classList.add('centered');
        } else {
          thumbnailsList.classList.remove('centered');
        }

        showPanels();
      }

      initViewer();
      if (manifest.scenes.length > 0) {
        switchToScene(manifest.scenes[0].id);
      } else {
        sceneNameDisplay.textContent = 'Нет панорам';
      }
      updateThumbnails();
    })();
  </script>
</body>
</html>
